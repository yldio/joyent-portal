query instance($id: ID!) {
  machines(id: $id) {
    results {
      id
      name
      networks {
        id
        name
        public
        fabric
        description
        subnet
        provision_start_ip
        provision_end_ip
        gateway
        resolvers
        internet_nat
        machines {
          id
          name
        }
      }
    }
  }
}
